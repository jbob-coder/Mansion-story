name: Validate world canon
on:
  push:
    paths:
      - 'data/world/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-world.yml'
  pull_request:
    paths:
      - 'data/world/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-world.yml'
  workflow_dispatch:
jobs:
  world-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators and test module
        run: python -m py_compile scripts/validate_world.py scripts/validate_ethics.py tests/test_world_integrity.py
      - name: Validate original atlas
        run: python scripts/validate_world.py
      - name: Validate world and ethics registries
        run: python scripts/validate_ethics.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
