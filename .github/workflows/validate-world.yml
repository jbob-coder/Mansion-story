name: Validate world canon
on:
  push:
    paths:
      - 'data/world/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine/**'
      - '.github/workflows/validate-world.yml'
  pull_request:
    paths:
      - 'data/world/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine/**'
      - '.github/workflows/validate-world.yml'
  workflow_dispatch:
jobs:
  world-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators, memory library and tests
        run: python -m compileall -q engine scripts tests
      - name: Validate original atlas
        run: python scripts/validate_world.py
      - name: Validate world and ethics registries
        run: python scripts/validate_ethics.py
      - name: Validate civilization, species and systems
        run: python scripts/validate_civilization.py
      - name: Validate cognition seed covers all characters
        run: python scripts/bootstrap_character_memory.py --validate
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
